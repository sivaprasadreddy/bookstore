<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<body>
<div layout:fragment="content">
    <div class="mb-4 flex items-center justify-between">
        <h1 class="text-3xl font-bold text-slate-900">Orders</h1>
    </div>

    <div th:if="${message}" class="mb-3 rounded-md border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700" role="alert">
        <span th:text="${message}">Success message</span>
    </div>
    <div th:if="${error}" class="mb-3 rounded-md border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700" role="alert">
        <span th:text="${error}">Error message</span>
    </div>

    <div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-slate-200 text-sm">
                <thead class="bg-slate-900 text-left text-slate-100">
                <tr>
                    <th class="px-4 py-3 font-semibold">Order Number</th>
                    <th class="px-4 py-3 font-semibold">Status</th>
                    <th class="px-4 py-3 font-semibold">Created At</th>
                    <th class="px-4 py-3 font-semibold">Actions</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 bg-white">
                <tr th:each="order : ${pagedResult.data}" class="hover:bg-slate-50">
                    <td class="px-4 py-3" th:text="${order.orderNumber}">ORD123</td>
                    <td class="px-4 py-3">
                        <span class="inline-flex rounded-full bg-sky-100 px-2 py-1 text-xs font-semibold text-sky-700"
                              th:if="${order.status.name() == 'NEW'}"
                              th:text="${order.status}">NEW</span>
                        <span class="inline-flex rounded-full bg-amber-100 px-2 py-1 text-xs font-semibold text-amber-700"
                              th:if="${order.status.name() == 'IN_PROCESS'}"
                              th:text="${order.status}">IN_PROCESS</span>
                        <span class="inline-flex rounded-full bg-emerald-100 px-2 py-1 text-xs font-semibold text-emerald-700"
                              th:if="${order.status.name() == 'DELIVERED'}"
                              th:text="${order.status}">DELIVERED</span>
                        <span class="inline-flex rounded-full bg-rose-100 px-2 py-1 text-xs font-semibold text-rose-700"
                              th:if="${order.status.name() == 'CANCELLED'}"
                              th:text="${order.status}">CANCELLED</span>
                    </td>
                    <td class="px-4 py-3" th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">2025-07-19 08:44</td>
                    <td class="px-4 py-3">
                        <a th:href="@{/admin/orders/{orderNumber}(orderNumber=${order.orderNumber})}" class="inline-flex items-center rounded-md border border-sky-600 px-3 py-1 text-sky-700 transition hover:bg-sky-50">
                            <i class="fas fa-eye"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${pagedResult.data.isEmpty()}">
                    <td colspan="4" class="px-4 py-3 text-center text-slate-500">No orders found</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{partials/pagination :: pagination}"></div>
</div>
</body>
</html>
