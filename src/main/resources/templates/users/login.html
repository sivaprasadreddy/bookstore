<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Login</title>
</head>
<body>

<div layout:fragment="content">
    <div class="mx-auto w-full max-w-xl">
        <div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
            <div class="bg-slate-900 px-6 py-4 text-center text-white">
                <h3 class="text-xl font-semibold">Login Form</h3>
            </div>
            <div class="p-6">
                <div th:if="${param.error}">
                    <div class="mb-3 rounded-md border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700">Invalid Email and Password.</div>
                </div>
                <div th:if="${message}">
                    <div class="mb-3 rounded-md border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700" th:text="${message}">Success Message</div>
                </div>
                <div th:if="${param.logout}">
                    <div class="mb-3 rounded-md border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700">You have been logged out.</div>
                </div>
                <div>
                    <form id="loginForm" method="post" th:action="@{/login}">
                        <div class="mb-4">
                            <label for="username" class="mb-1 block text-sm font-medium text-slate-700">Email*</label>
                            <input type="text" id="username" name="username"
                                   class="w-full rounded-md border border-slate-300 px-3 py-2"
                                   placeholder="Enter email" />
                        </div>

                        <div class="mb-4">
                            <label for="password" class="mb-1 block text-sm font-medium text-slate-700">Password*</label>
                            <input type="password" id="password" name="password"
                                   class="w-full rounded-md border border-slate-300 px-3 py-2"
                                   placeholder="Enter password" />
                        </div>
                        <button type="submit" class="inline-flex items-center rounded-md bg-sky-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-sky-700">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
