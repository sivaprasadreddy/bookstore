<div th:fragment="pagination">
    <nav aria-label="Page navigation" class="mt-8" th:if="${pagination.totalPages() > 1 }">
        <ul class="flex flex-wrap items-center justify-center gap-2 text-sm">
            <li>
                <a class="inline-flex rounded-md border border-slate-300 bg-white px-3 py-2 font-medium text-slate-700 transition hover:bg-slate-100"
                   th:classappend="${!pagination.hasPreviousPage()} ? ' pointer-events-none opacity-50' : ''"
                   href="#" th:href="@{${pagination.getFirstPageLink()}}">First</a>
            </li>
            <li>
                <a class="inline-flex rounded-md border border-slate-300 bg-white px-3 py-2 font-medium text-slate-700 transition hover:bg-slate-100"
                   th:classappend="${!pagination.hasPreviousPage()} ? ' pointer-events-none opacity-50' : ''"
                   href="#" th:href="@{${pagination.getPreviousPageLink()}}">Previous</a>
            </li>
            <li>
                <span class="inline-flex rounded-md border border-slate-200 bg-slate-100 px-3 py-2 text-slate-700">
                    <span>Page</span> <span class="mx-1 font-semibold" id="current-page" th:text="${pagination.currentPageNo()}">1</span>
                    <span>of</span> <span class="mx-1 font-semibold" id="total-pages" th:text="${pagination.totalPages()}">1</span>
                    (<span id="total-elements" th:text="${pagination.totalElements()}">1</span>)
                </span>
            </li>
            <li>
                <a class="inline-flex rounded-md border border-slate-300 bg-white px-3 py-2 font-medium text-slate-700 transition hover:bg-slate-100"
                   th:classappend="${!pagination.hasNextPage()} ? ' pointer-events-none opacity-50' : ''"
                   href="#" th:href="@{${pagination.getNextPageLink()}}">Next</a>
            </li>
            <li>
                <a class="inline-flex rounded-md border border-slate-300 bg-white px-3 py-2 font-medium text-slate-700 transition hover:bg-slate-100"
                   th:classappend="${!pagination.hasNextPage()} ? ' pointer-events-none opacity-50' : ''"
                   href="#" th:href="@{${pagination.getLastPageLink()}}">Last</a>
            </li>
        </ul>
    </nav>
</div>
