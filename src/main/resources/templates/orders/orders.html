<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<body>
<div layout:fragment="content">
    <div>
        <h2 class="text-2xl font-bold text-slate-900">All Orders</h2>
        <hr class="my-4 border-slate-200"/>
        <div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200 text-sm">
                    <thead class="bg-slate-900 text-left text-slate-100">
                    <tr>
                        <th class="px-4 py-3 font-semibold" scope="col">Order ID</th>
                        <th class="px-4 py-3 font-semibold" scope="col">Status</th>
                        <th class="px-4 py-3 font-semibold" scope="col">Created Date</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 bg-white">
                    <tr th:each="order : ${orders}" class="hover:bg-slate-50">
                        <td class="px-4 py-3"><a class="font-medium text-sky-700 hover:underline" th:href="${'/orders/'+order.orderNumber}" th:text="${order.orderNumber}">OrderNumber</a></td>
                        <td class="px-4 py-3" th:text="${order.status}">status</td>
                        <td class="px-4 py-3" th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">Date</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
