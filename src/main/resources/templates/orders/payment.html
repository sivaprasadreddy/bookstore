<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Payment - BookStore</title>
</head>
<body>
<div layout:fragment="content">
    <div class="mx-auto max-w-xl">
        <div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
            <div class="border-b border-slate-200 bg-slate-900 px-6 py-4 text-white">
                <h1 class="text-xl font-semibold">Complete your payment</h1>
                <p class="mt-1 text-sm text-slate-300">
                    Order <span th:text="${order.orderNumber}">order-number</span>
                </p>
            </div>

            <div class="space-y-6 p-6">
                <div class="flex items-center justify-between rounded-lg bg-slate-50 px-4 py-5">
                    <span class="text-sm font-medium text-slate-600">Order total</span>
                    <span class="text-2xl font-bold text-slate-900"
                          th:text="|₹${#numbers.formatDecimal(order.totalAmount, 1, 2)}|">₹0.00</span>
                </div>

                <form th:action="@{/orders/{orderNumber}/payment(orderNumber=${order.orderNumber})}"
                      th:object="${paymentForm}"
                      method="post"
                      class="space-y-4">
                    <div th:if="${#fields.hasGlobalErrors()}"
                         class="rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"
                         role="alert">
                        <p th:each="error : ${#fields.globalErrors()}" th:text="${error}">Payment failed.</p>
                    </div>

                    <div>
                        <label for="cardNumber" class="mb-1 block text-sm font-medium text-slate-700">Card number</label>
                        <input id="cardNumber" name="cardNumber" type="text" inputmode="numeric"
                               autocomplete="cc-number" placeholder="4111 1111 1111 1111"
                               class="w-full rounded-md border border-slate-300 px-3 py-2"
                               th:classappend="${#fields.hasErrors('cardNumber')} ? ' border-red-500' : ''"/>
                        <p th:if="${#fields.hasErrors('cardNumber')}" th:errors="*{cardNumber}"
                           class="mt-1 text-sm text-red-600">Invalid card number.</p>
                    </div>

                    <div class="grid grid-cols-3 gap-4">
                        <div>
                            <label for="expiryMonth" class="mb-1 block text-sm font-medium text-slate-700">Expiry month</label>
                            <input id="expiryMonth" th:field="*{expiryMonth}" type="number" min="1" max="12"
                                   autocomplete="cc-exp-month" placeholder="MM"
                                   class="w-full rounded-md border border-slate-300 px-3 py-2"/>
                            <p th:if="${#fields.hasErrors('expiryMonth')}" th:errors="*{expiryMonth}"
                               class="mt-1 text-sm text-red-600">Invalid month.</p>
                        </div>
                        <div>
                            <label for="expiryYear" class="mb-1 block text-sm font-medium text-slate-700">Expiry year</label>
                            <input id="expiryYear" th:field="*{expiryYear}" type="number" min="2000" max="9999"
                                   autocomplete="cc-exp-year" placeholder="YYYY"
                                   class="w-full rounded-md border border-slate-300 px-3 py-2"/>
                            <p th:if="${#fields.hasErrors('expiryYear')}" th:errors="*{expiryYear}"
                               class="mt-1 text-sm text-red-600">Invalid year.</p>
                        </div>
                        <div>
                            <label for="cvv" class="mb-1 block text-sm font-medium text-slate-700">CVV</label>
                            <input id="cvv" name="cvv" type="password" inputmode="numeric" autocomplete="cc-csc"
                                   maxlength="4" placeholder="123"
                                   class="w-full rounded-md border border-slate-300 px-3 py-2"
                                   th:classappend="${#fields.hasErrors('cvv')} ? ' border-red-500' : ''"/>
                            <p th:if="${#fields.hasErrors('cvv')}" th:errors="*{cvv}"
                               class="mt-1 text-sm text-red-600">Invalid CVV.</p>
                        </div>
                    </div>

                    <button type="submit"
                            class="inline-flex w-full items-center justify-center gap-2 rounded-md bg-sky-600 px-4 py-3 text-base font-semibold text-white transition hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-2">
                        <i class="fas fa-lock" aria-hidden="true"></i>
                        Pay with test card
                    </button>
                </form>

                <p class="text-center text-xs text-slate-500">
                    Test payments only. Card details are validated but never stored.
                </p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
