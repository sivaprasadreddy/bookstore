spring.application.name=bookstore

spring.docker.compose.lifecycle-management=start_only

#### App ####
app.data-import-enabled=true
app.data-import-file=/data/books-1k.jsonlines
app.page-size=20
app.new-orders-job-cron=*/10 * * * * *
payment.test-card-numbers=4111111111111111,5555555555554444

#### Logging ####
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}] 
logging.include-application-name=false
logging.level.com.sivalabs=debug

#### Web ####
spring.mvc.hiddenmethod.filter.enabled=true
spring.mvc.problemdetails.enabled=true
spring.threads.virtual.enabled=true

#### Actuator ####
management.endpoints.web.exposure.include=*
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=1
management.otlp.metrics.export.url=${METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
management.opentelemetry.tracing.export.otlp.endpoint=${TRACES_EXPORT_URL:http://localhost:4318/v1/traces}
management.opentelemetry.logging.export.otlp.endpoint=${LOGS_EXPORT_URL:http://localhost:4318/v1/logs}

#### Database ####
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

#### Redis ####
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

#### Spring Modulith ####
spring.modulith.events.jdbc.schema-initialization.enabled=true
spring.modulith.events.republish-outstanding-events-on-restart=true
spring.modulith.events.completion-mode=archive
